<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#12557f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- tower -->
  <path d="M32 54 L29.5 34 L34.5 34 Z" fill="#2d9cce"/>
  <line x1="32" y1="54" x2="32" y2="33" stroke="#7fc4e8" stroke-width="2.4" stroke-linecap="round"/>
  <!-- blades -->
  <g stroke-linecap="round" fill="none">
    <line x1="32" y1="31" x2="32" y2="9"  stroke="#e8f6ff" stroke-width="4.6"/>
    <line x1="32" y1="31" x2="13.3" y2="41.5" stroke="#d6eefb" stroke-width="4.6"/>
    <line x1="32" y1="31" x2="50.7" y2="41.5" stroke="#c2e5f7" stroke-width="4.6"/>
  </g>
  <!-- hub -->
  <circle cx="32" cy="31" r="5.2" fill="#f0f8ff"/>
  <circle cx="32" cy="31" r="2.6" fill="#1db87e"/>
  <!-- ground -->
  <path d="M12 56 Q22 52.5 32 56 T52 56" stroke="#1db87e" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85"/>
</svg>
